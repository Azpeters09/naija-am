<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(135deg, #0A2E1F 0%, #143D2A 40%, #0A2E1F 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  /* Geometric pattern */
  .pattern {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: 
      repeating-linear-gradient(45deg, transparent, transparent 20px, #fff 20px, #fff 21px),
      repeating-linear-gradient(-45deg, transparent, transparent 20px, #fff 20px, #fff 21px);
  }
  .accent-line {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #25D366, #C8963E, #25D366);
  }
  .card {
    position: relative; z-index: 1;
    background: #FDF8F0;
    border-radius: 24px;
    padding: 56px 64px;
    max-width: 700px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    text-align: center;
  }
  .card .flag { font-size: 40px; margin-bottom: 12px; }
  .card h1 {
    font-size: 56px; font-weight: 700; color: #0A2E1F;
    line-height: 1.1; margin-bottom: 12px;
  }
  .card h1 span { color: #25D366; }
  .card .tagline {
    font-size: 20px; color: #6B7280; margin-bottom: 32px;
    font-family: -apple-system, sans-serif;
  }
  .card .features {
    display: flex; gap: 24px; justify-content: center;
    margin-bottom: 36px;
    font-family: -apple-system, sans-serif;
  }
  .card .feature {
    background: #fff; border-radius: 12px; padding: 16px 20px;
    font-size: 13px; color: #4B5563; border: 1px solid #E5E0D8;
  }
  .card .feature strong { color: #0A2E1F; display: block; margin-bottom: 4px; }
  .card .wa-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: #25D366; color: #fff;
    padding: 14px 32px; border-radius: 100px;
    font-family: -apple-system, sans-serif;
    font-weight: 700; font-size: 16px;
  }
  .card .price {
    margin-top: 16px; font-size: 14px; color: #9CA3AF;
    font-family: -apple-system, sans-serif;
  }
  .card .price strong { color: #0A2E1F; font-size: 18px; }
</style>
</head>
<body>
<div class="pattern"></div>
<div class="accent-line"></div>
<div class="card">
  <div class="flag">🇳🇬</div>
  <h1>Naija <span>AM</span></h1>
  <p class="tagline">Nigeria in 2 minutes, every morning on WhatsApp</p>
  <div class="features">
    <div class="feature"><strong>💼 Business</strong>Markets & economy</div>
    <div class="feature"><strong>🏟️ Sports</strong>EPL & Naija abroad</div>
    <div class="feature"><strong>💻 Tech</strong>Startups & funding</div>
  </div>
  <div class="wa-badge">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    Get it on WhatsApp
  </div>
  <p class="price"><strong>₦1,000</strong>/month • 7-day free trial</p>
</div>
</body>
</html>
